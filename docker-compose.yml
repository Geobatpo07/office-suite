# ===========================================
# Docker Compose pour Office Suite Dev Local
# Ports adaptés pour Windows / IIS
# ===========================================

services:
  # ================================
  # Traefik HTTPS Reverse Proxy
  # ================================
  traefik:
    # v3.0 (et jusqu'a v3.5) negocie l'API Docker en 1.24, or Docker
    # Engine 29+ impose un minimum de 1.40 => le provider Docker ne
    # demarrait pas du tout. v3.7 negocie correctement la version.
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    # Pas de `command:` ici : traefik.yml etant monte, les flags CLI
    # seraient ignores (sources de conf statique mutuellement exclusives).
    ports:
      - "8081:8081"   # HTTP Traefik
      - "8443:8443"   # HTTPS Traefik
      - "8089:8080"   # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks:
      office_net:
        # Permet aux conteneurs de resoudre les domaines publics
        # entre eux (Nextcloud -> OnlyOffice, HedgeDoc -> Keycloak).
        # auth.test (pas auth.localhost) : voir la note sur Keycloak plus bas.
        aliases:
          - nextcloud.localhost
          - office.localhost
          - notes.localhost
          - auth.test
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # ================================
  # PostgreSQL for Nextcloud
  # ================================
  nextcloud-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER} -d ${NEXTCLOUD_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ================================
  # Redis - caching + file locking for Nextcloud
  # ================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ================================
  # MinIO - S3-compatible primary object storage for Nextcloud
  # ================================
  minio:
    # L'image officielle minio/minio n'est plus publiee (depot GitHub
    # archive, retrait de Docker Hub fin 2025). cgr.dev/chainguard/minio
    # est l'alternative gratuite maintenue par une organisation - en
    # contrepartie, seul le tag `latest` est disponible sans compte payant
    # (pas d'historique de versions figees comme les autres images du
    # stack) : `docker compose pull` peut donc ramener une version plus
    # recente de MinIO sans avertissement prealable.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage.rule=Host(`storage.localhost`)"
      - "traefik.http.routers.storage.entrypoints=websecure"
      - "traefik.http.routers.storage.tls=true"
      # Route vers la console web (9001), pas l'API S3 (9000) : cette
      # derniere n'est jamais appelee que depuis Nextcloud, en interne.
      - "traefik.http.services.storage.loadbalancer.server.port=9001"
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ================================
  # Nextcloud
  # ================================
  nextcloud:
    image: nextcloud:29-apache
    restart: unless-stopped
    # Trusts the local CA on every start, before Nextcloud's own entrypoint
    # runs. Needed so PHP/curl accepts https://auth.test:8443 (SSO
    # Keycloak) - the image's `before-starting` hook phase looked like the
    # natural place for this, but it runs as root only on a container's
    # very first boot; on every later restart of an already-installed
    # instance it runs as www-data, which can't write the system trust
    # store. This wrapper always runs as root (the image's default user),
    # before entrypoint.sh gets a chance to drop privileges.
    entrypoint:
      - /bin/sh
      - -c
      - update-ca-certificates && exec /entrypoint.sh apache2-foreground
    depends_on:
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Lus par nextcloud/hooks/post-installation/*.sh pour configurer
      # automatiquement OnlyOffice, le SSO Keycloak et Redis au premier
      # demarrage.
      JWT_SECRET: ${JWT_SECRET}
      # Doit correspondre au secret du client "nextcloud-client" defini
      # dans keycloak/realm-office.json (importe automatiquement).
      NEXTCLOUD_OIDC_SECRET: ${NEXTCLOUD_OIDC_SECRET}
      # Doit correspondre au --static-auth-secret du service coturn.
      TURN_SECRET: ${TURN_SECRET}
      # Adresse a laquelle un navigateur (pas forcement sur cette machine)
      # peut joindre coturn - voir la note dans talk.sh. "localhost" par
      # defaut (usage solo) ; IP LAN de cette machine pour partager Talk
      # avec d'autres appareils du meme reseau.
      TURN_HOST: ${TURN_HOST:-localhost}
      # Lu par nextcloud/hooks/post-installation/redis.sh.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Stockage primaire S3/MinIO : lues uniquement par l'installeur de
      # Nextcloud (occ maintenance:install --autoconfig), au tout premier
      # demarrage sur un volume vide - passer par ces variables plutot
      # qu'un hook post-installation, car le stockage objet doit etre en
      # place AVANT la creation du premier utilisateur (migrer un stockage
      # local existant vers un stockage objet n'est pas une simple bascule
      # de config, ce n'est pas supporte par ce projet).
      OBJECTSTORE_S3_BUCKET: nextcloud
      OBJECTSTORE_S3_HOST: minio
      OBJECTSTORE_S3_PORT: "9000"
      OBJECTSTORE_S3_USEPATH_STYLE: "true"
      OBJECTSTORE_S3_SSL: "false"
      OBJECTSTORE_S3_REGION: us-east-1
      OBJECTSTORE_S3_KEY: ${MINIO_ROOT_USER}
      OBJECTSTORE_S3_SECRET: ${MINIO_ROOT_PASSWORD}
      OBJECTSTORE_S3_AUTOCREATE: "true"
      # Le port fait partie du domaine de confiance : sans lui,
      # Nextcloud repond "Access through untrusted domain".
      NEXTCLOUD_TRUSTED_DOMAINS: "nextcloud.localhost nextcloud.localhost:8443 localhost"
      # Terminaison TLS assuree par Traefik : sans ces variables,
      # Nextcloud genere des URLs http:// => boucles de redirection.
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: nextcloud.localhost:8443
      OVERWRITECLIURL: https://nextcloud.localhost:8443
      TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - nextcloud_data:/var/www/html
      - ./nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      # Installe par le custom `entrypoint:` ci-dessus, a chaque demarrage.
      - ./traefik/certs/ca.crt:/usr/local/share/ca-certificates/office-suite-ca.crt:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.localhost`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M

  # ================================
  # OnlyOffice
  # ================================
  onlyoffice:
    image: onlyoffice/documentserver:8.1
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
      # Le connecteur Nextcloud attend cet en-tete, pas "Authorization".
      - JWT_HEADER=AuthorizationJwt
      # Sans ca, la protection anti-SSRF integree d'OnlyOffice
      # (request-filtering-agent) bloque tout appel de docservice vers
      # Nextcloud : "http://nextcloud/..." resout vers une IP du reseau
      # Docker interne (172.18.x.x), qui EST une IP privee par definition
      # - la bibliotheque appelle abort() dessus, ce qui remonte cote
      # client comme "Echec du telechargement" des l'ouverture d'un
      # document, sans rapport avec la taille du fichier ou son contenu.
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.office.rule=Host(`office.localhost`)"
      - "traefik.http.routers.office.entrypoints=websecure"
      - "traefik.http.routers.office.tls=true"
      # L'image expose 80 ET 443 : sans ce label Traefik ne peut pas choisir.
      - "traefik.http.services.office.loadbalancer.server.port=80"
    networks:
      - office_net
    deploy:
      resources:
        limits:
          # Le plus gourmand du stack : la conversion de documents
          # (docx/xlsx/pptx/pdf <-> ODF) tourne dans ce conteneur, pas
          # dans Nextcloud. 2048M s'est revele trop juste : le service
          # tourne deja a ~1.2G au repos (rien qu'avec Node.js, le
          # convertisseur x2t et les workers demarres), ne laissant
          # quasiment plus de marge pour la conversion elle-meme des
          # qu'un fichier depasse quelques dizaines de Ko - observe en
          # conditions reelles avec un PDF d'1 Mo qui echouait
          # systematiquement a la conversion malgre un telechargement
          # reussi cote Nextcloud.
          cpus: "3.00"
          memory: 3584M

  # ================================
  # PostgreSQL for HedgeDoc
  # ================================
  hedgedoc-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HEDGEDOC_DB_USER}
      POSTGRES_PASSWORD: ${HEDGEDOC_DB_PASSWORD}
      POSTGRES_DB: ${HEDGEDOC_DB_NAME}
    volumes:
      - hedgedoc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HEDGEDOC_DB_USER} -d ${HEDGEDOC_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ================================
  # HedgeDoc
  # ================================
  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:1.9.9
    restart: unless-stopped
    depends_on:
      hedgedoc-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      CMD_DB_URL: postgres://${HEDGEDOC_DB_USER}:${HEDGEDOC_DB_PASSWORD}@hedgedoc-db:5432/${HEDGEDOC_DB_NAME}
      CMD_DOMAIN: notes.localhost
      CMD_PROTOCOL_USESSL: "true"
      # HedgeDoc construit ses URLs publiques (dont le redirect_uri OAuth)
      # a partir de CMD_PORT : le port interne doit donc etre le port
      # public (8443), sinon le callback OAuth pointe vers ":3000" ou
      # aucun port, ce que Keycloak rejette (redirect_uri mismatch).
      CMD_PORT: "8443"
      CMD_URL_ADDPORT: "true"
      # Sans secret fixe, les sessions sautent a chaque redemarrage.
      CMD_SESSION_SECRET: ${HEDGEDOC_SESSION_SECRET}
      CMD_DEFAULT_PERMISSION: "freely"
      CMD_OAUTH2_PROVIDERNAME: Keycloak
      CMD_OAUTH2_CLIENT_ID: hedgedoc-client
      # Doit correspondre au secret du client "hedgedoc-client" defini
      # dans keycloak/realm-office.json (importe automatiquement).
      CMD_OAUTH2_CLIENT_SECRET: ${HEDGEDOC_OAUTH_SECRET}
      # Realm dedie "office", pas "master" : master est reserve a
      # l'administration de Keycloak lui-meme, pas aux clients applicatifs.
      CMD_OAUTH2_AUTHORIZATION_URL: https://auth.test:8443/realms/office/protocol/openid-connect/auth
      CMD_OAUTH2_TOKEN_URL: https://auth.test:8443/realms/office/protocol/openid-connect/token
      CMD_OAUTH2_USER_PROFILE_URL: https://auth.test:8443/realms/office/protocol/openid-connect/userinfo
      CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR: preferred_username
      CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR: name
      CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR: email
      CMD_OAUTH2_SCOPE: "openid email profile"
      # Les appels OAuth token/userinfo sont faits cote serveur : Node
      # doit faire confiance a la CA locale qui signe auth.test.
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - hedgedoc_uploads:/hedgedoc/public/uploads
      - ./traefik/certs/ca.crt:/certs/ca.crt:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hedgedoc.rule=Host(`notes.localhost`)"
      - "traefik.http.routers.hedgedoc.entrypoints=websecure"
      - "traefik.http.routers.hedgedoc.tls=true"
      - "traefik.http.services.hedgedoc.loadbalancer.server.port=8443"
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ================================
  # Mailpit - Local SMTP catch-all for dev
  # ================================
  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    # Pas d'authentification/TLS SMTP : c'est un relais local jete, les
    # emails ne quittent jamais le reseau docker (pas de vraie livraison).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ================================
  # coturn - STUN/TURN server for Nextcloud Talk
  # ================================
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # WebRTC media (audio/video/screenshare) is negotiated directly
    # between the browser and this server over raw UDP/TCP - it cannot
    # go through Traefik (no virtual-host routing for non-HTTP traffic),
    # so these ports are published straight to the host instead.
    command: >
      -n
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --realm=turn.localhost
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --no-cli
      --no-tls
      --no-dtls
      --log-file=stdout
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # ================================
  # Keycloak
  # ================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    # --import-realm charge automatiquement tout fichier JSON depose
    # dans /opt/keycloak/data/import au premier demarrage (si le realm
    # n'existe pas deja) : c'est ce qui rend le client OAuth HedgeDoc
    # reproductible sur un clone frais, sans etape manuelle via kcadm.
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      # Derriere un proxy qui termine le TLS, sans ces variables
      # Keycloak emet de mauvaises URLs de redirection.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Volontairement HORS *.localhost, contrairement aux 3 autres domaines :
      # curl/libcurl (donc PHP/Nextcloud) resout tout *.localhost en 127.0.0.1
      # en dur (RFC 6761), meme avec un /etc/hosts explicite ou un DNS Docker
      # correct - ca casse les appels serveur a serveur de user_oidc
      # (discovery/token/userinfo). .test (RFC 2606) n'a pas ce probleme et
      # n'est pas auto-resolu par les navigateurs : voir le README pour
      # l'entree /etc/hosts obligatoire sur ce domaine precis.
      KC_HOSTNAME: https://auth.test:8443
      KC_HOSTNAME_STRICT: "false"
    volumes:
      # start-dev utilise une base H2 locale : sans volume, tous les
      # realms/clients/utilisateurs disparaissent a la recreation.
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-office.json:/opt/keycloak/data/import/realm-office.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.test`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      # L'image expose 8080, 8443 et 9000 : label obligatoire.
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - office_net
    deploy:
      resources:
        limits:
          # JVM : Keycloak reserve une bonne partie de son tas au demarrage,
          # meme en dev.
          cpus: "1.00"
          memory: 1024M

  # ================================
  # Keycloak SMTP config (one-shot)
  # ================================
  keycloak-init:
    image: quay.io/keycloak/keycloak:25.0
    restart: "no"
    depends_on:
      - keycloak
    entrypoint: ["/bin/sh", "/configure-smtp.sh"]
    environment:
      KEYCLOAK_USER: ${KEYCLOAK_USER}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD}
    volumes:
      - ./keycloak/configure-smtp.sh:/configure-smtp.sh:ro
    networks:
      - office_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

# ================================
# Volumes
# ================================
volumes:
  nextcloud_data:
  nextcloud_db_data:
  hedgedoc_db_data:
  hedgedoc_uploads:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_db:
  keycloak_data:
  redis_data:
  minio_data:

# ================================
# Network
# ================================
networks:
  office_net:
    driver: bridge
